org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official
# R8 8.10.24, bundled with AGP 8.10.1, races in horizontal class merging: whether a
# constructor it creates lands in the ART baseline profile depends on thread timing
# (b/434861604, fixed in R8 8.10.31), so two builds of one commit could differ in
# assets/dexopt/baseline.prof. One R8 thread keeps them identical; drop this once AGP
# bundles a fixed R8.
android.r8.threadPoolSize=1
